[api]
gamma_base_url = "https://gamma-api.polymarket.com"
clob_base_url = "https://clob.polymarket.com"
data_base_url = "https://data-api.polymarket.com"
request_timeout_seconds = 12

[cache]
enabled = true
directory = ".cache/http"
ttl_seconds = 900
stale_if_error = true

[storage]
enabled = true
sqlite_path = "data/ploymarket.sqlite"
fresh_market_ttl_seconds = 900
fresh_history_ttl_seconds = 180

[kalshi]
base_url = "https://external-api.kalshi.com/trade-api/v2"
request_timeout_seconds = 12
limit = 10
max_pages = 2
status = "open"
min_volume_24h = 0.0
series_tickers = ["KXBTC", "KXBTCD", "KXBTC15M", "KXBTCMAX150"]

[btc_price]
provider = "coinbase_public"
base_url = "https://api.coinbase.com"
product_id = "BTC-USD"
granularity = "FIVE_MINUTE"

[btc_filter]
enabled = true
lookback_hours = 1
down_threshold = -0.0025
avoid_yes_price_gte = 0.50

[universe]
keywords = ["bitcoin", "btc"]
limit = 20
max_pages = 10
order = "volume_24hr"
active = true
closed = false
min_liquidity = 1000.0
require_orderbook = true

[signal]
history_interval = "1w"
history_fidelity_minutes = 5
short_window = 6
long_window = 24
min_momentum = 0.005
min_edge = 0.003
safety_margin = 0.005
buy_below = 0.92
sell_above = 0.08

[execution]
maker_enabled = false
maker_price_improvement = 0.01
maker_min_edge = 0.015
maker_fee_rate = 0.0
maker_order_ttl_seconds = 300

[risk]
starting_cash = 1000.0
max_position_usdc = 50.0
max_market_exposure_usdc = 75.0
max_total_exposure_usdc = 250.0
max_open_positions = 5
daily_loss_limit_usdc = 35.0
max_drawdown_pct = 0.12
stop_loss_pct = 0.25
take_profit_pct = 0.35
max_spread = 0.08
min_price = 0.03
max_price = 0.97
paper_reentry_cooldown_seconds = 3600
paper_take_profit_reentry_cooldown_seconds = 600
partial_take_profit_pct = 0.125
partial_take_profit_fraction = 0.5
trailing_stop_activation_pct = 0.12
trailing_stop_drawdown_pct = 0.06
paper_full_take_profit_pct = 0.25
paper_reentry_edge_multiplier = 2.0
target_market_max_distance_pct = 0.025
target_stop_cooldown_seconds = 21600
target_buy_yes_max_price = 0.65
target_buy_no_max_price = 0.75

[backtest]
trade_size_usdc = 25.0
taker_fee_rate = 0.02
slippage_bps = 25
output_dir = "data"
