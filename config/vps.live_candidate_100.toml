[api]
gamma_base_url = "https://gamma-api.polymarket.com"
clob_base_url = "https://clob.polymarket.com"
data_base_url = "https://data-api.polymarket.com"
request_timeout_seconds = 12

[cache]
enabled = false
directory = "runtime/live_candidate_100/cache/http"
ttl_seconds = 0
stale_if_error = false

[storage]
enabled = true
sqlite_path = "runtime/live_candidate_100/ploymarket.sqlite"
fresh_market_ttl_seconds = 0
fresh_history_ttl_seconds = 180

[btc_price]
provider = "coinbase_public"
base_url = "https://api.coinbase.com"
product_id = "BTC-USD"
granularity = "FIVE_MINUTE"

[btc_filter]
enabled = true
lookback_hours = 1
down_threshold = -0.0025
avoid_yes_price_gte = 0.50

[universe]
keywords = ["bitcoin", "btc"]
limit = 20
max_pages = 10
order = "volume_24hr"
active = true
closed = false
min_liquidity = 1000.0
require_orderbook = true

[signal]
history_interval = "1w"
history_fidelity_minutes = 5
short_window = 6
long_window = 24
min_momentum = 0.005
min_edge = 0.003
safety_margin = 0.0075
buy_below = 0.85
sell_above = 0.15
entry_allowlist = ["above_below_expiry:BUY_YES"]
min_entry_net_edge = 0.01

[execution]
maker_enabled = false
maker_price_improvement = 0.01
maker_min_edge = 0.015
maker_fee_rate = 0.0
maker_order_ttl_seconds = 300

[execution_stress]
enabled = true
adverse_price_moves = [0.0025, 0.01]
partial_fill_fractions = [0.5, 0.25]
min_surviving_net_edge = 0.003
max_unfilled_fraction = 0.5
operational_failure_pause_seconds = 900
consecutive_failure_circuit_breaker = 3

[risk]
starting_cash = 100.0
max_position_usdc = 31.0
max_market_exposure_usdc = 31.0
max_total_exposure_usdc = 31.0
max_open_positions = 1
daily_loss_limit_usdc = 10.0
max_drawdown_pct = 0.10
stop_loss_pct = 0.15
take_profit_pct = 0.20
max_spread = 0.04
min_price = 0.15
max_price = 0.55
paper_reentry_cooldown_seconds = 7200
paper_take_profit_reentry_cooldown_seconds = 1800
partial_take_profit_pct = 1.0
partial_take_profit_fraction = 0.0
trailing_stop_activation_pct = 1.0
trailing_stop_drawdown_pct = 1.0
paper_full_take_profit_pct = 0.20
paper_reentry_edge_multiplier = 2.5
live_reprice_edge_multiplier = 2.0
target_market_max_distance_pct = 0.025
target_stop_cooldown_seconds = 21600
target_buy_yes_max_price = 0.65
target_buy_no_max_price = 0.75
range_buy_yes_max_price = 0.55
range_buy_no_max_price = 0.70
range_market_safety_band_pct = 0.02
btc_moving_away_return_pct = 0.001
strategy_loss_pause_count = 2
strategy_loss_pause_window_seconds = 21600
readiness_max_drawdown_pct = 0.05
paper_probe_enabled = false
paper_probe_zero_run_threshold = 0
paper_probe_trade_size_usdc = 1.0
paper_probe_min_edge = 0.01
paper_probe_max_open_positions = 0
paper_probe_hard_max_open_positions = 0
paper_probe_max_total_exposure_usdc = 0.0
paper_probe_max_new_positions_per_run = 0
btc_candle_max_age_seconds = 900
stop_loss_usdc = 10.0
take_profit_usdc = 20.0

[backtest]
trade_size_usdc = 30.0
taker_fee_rate = 0.02
slippage_bps = 25
output_dir = "runtime/live_candidate_100"
